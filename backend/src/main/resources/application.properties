# Spring Boot 3 不自动加载 bootstrap.properties，显式导入 Apollo 启动配置。
spring.config.import=classpath:bootstrap.properties

# 接口文档（springdoc）默认关闭：部署需要时用 Apollo 或启动参数显式开启
# springdoc.api-docs.enabled=true。这里只放工具自身的默认值，业务配置仍全部来自 Apollo。
springdoc.api-docs.enabled=false

# 只文档化对外业务接口，避免把框架内部端点写进契约。
springdoc.paths-to-match=/api/**
